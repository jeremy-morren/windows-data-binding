version: 2
updates:
  # The generator itself. Microsoft.CodeAnalysis is deliberately held back: the version referenced here
  # is the oldest Roslyn the analyzer will load against, so raising it raises the SDK every consumer
  # needs. Bump it by hand, deliberately.
  - package-ecosystem: "nuget"
    directory: "/src/WinDataBinding.SourceGenerator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis.*"

  - package-ecosystem: "nuget"
    directory: "/test/WinDataBinding.SourceGenerator.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One pull request for the test stack rather than one for each of its parts
      test:
        patterns:
          - "xunit*"
          - "FluentAssertions"
          - "Microsoft.Testing.*"
          - "Basic.Reference.Assemblies*"

  # The workflow pins major versions, which move about once a year
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
